<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — ThinKorix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand"><img src="logo.jpeg" alt="ThinKorix" style="width:30px;height:30px;border-radius:8px;">ThinKorix Ambassadors</a>
    <p class="sub" id="sub">Choose a new password</p>

    <div class="alert alert-error" id="alert-err"></div>
    <div class="alert alert-success" id="alert-ok"></div>

    <form id="reset-form">
      <div class="field">
        <label for="rp-password">New password</label>
        <input type="password" id="rp-password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      </div>
      <div class="field">
        <label for="rp-password-2">Confirm password</label>
        <input type="password" id="rp-password-2" required minlength="8" autocomplete="new-password" placeholder="Repeat the password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="rp-submit">Set new password</button>
    </form>
    <p style="text-align:center;margin-top:16px;"><a href="login.html" style="font-size:12.5px;color:var(--slate);">Back to log in</a></p>
  </div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script src="js/reset.js"></script>
</body>
</html>
