<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — ThinKorix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand"><img src="logo.jpeg" alt="ThinKorix" style="width:30px;height:30px;border-radius:8px;">ThinKorix Ambassadors</a>
    <p class="sub">Reset your password</p>

    <a href="login.html" class="auth-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      Back to log in
    </a>

    <div class="alert alert-error" id="alert-err"></div>
    <div class="alert alert-success" id="alert-ok"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="fp-email">Email</label>
        <input type="email" id="fp-email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="fp-submit">Send reset link</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script src="js/forgot.js"></script>
</body>
</html>
